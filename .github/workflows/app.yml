name: Overworld app

on:
  push:
    paths: ['app/**', '.github/workflows/app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/app.yml']
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.8'

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test
      - name: Web-compiled tests (dart2js integer semantics)
        run: flutter test --platform chrome test/geo_web_safe_test.dart
      - name: Validate map styles with the MapLibre style spec
        run: |
          npm install --no-save --silent @maplibre/maplibre-gl-style-spec@23
          for f in build/styles/*.json; do npx gl-style-validate "$f"; done

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: overworld-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}
      - name: Package unsigned app
        run: cd build/ios/iphoneos && mkdir Payload && cp -R Runner.app Payload/ && zip -qr overworld-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: overworld-ios-unsigned
          path: app/build/ios/iphoneos/overworld-unsigned.ipa

  web:
    name: Web preview build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release --dart-define=FAKE_STORE=true
      - uses: actions/upload-artifact@v4
        with:
          name: overworld-web
          path: app/build/web
